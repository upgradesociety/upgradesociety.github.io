<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ .Description | default .Summary | plainify | default site.Params.description }}">
  {{ with .Params.redirect }}
  <meta http-equiv="refresh" content="0; url={{ . | relURL }}">
  <link rel="canonical" href="{{ . | absURL }}">
  {{ else }}
  <link rel="canonical" href="{{ $.Permalink }}">
  {{ end }}
  {{ $styles := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $styles.RelPermalink }}" integrity="{{ $styles.Data.Integrity }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }}{{ end }}">
  <meta property="og:description" content="{{ .Description | default .Summary | plainify | default site.Params.description }}">
  <meta property="og:url" content="{{ with .Params.redirect }}{{ . | absURL }}{{ else }}{{ .Permalink }}{{ end }}">
  <meta property="og:image" content="{{ "images/home.jpg" | absURL }}">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body class="{{ if .IsHome }}home{{ else }}content-page{{ end }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partial "header.html" . }}
  {{ block "main" . }}{{ end }}
  {{ partial "footer.html" . }}
  {{ $script := resources.Get "js/site.js" | minify | fingerprint }}
  <script src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}" defer></script>
</body>
</html>
