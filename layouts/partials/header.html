{{ $navigation := site.Data.navigation.top }}
<header class="site-header">
  <div class="header-inner">
    <button class="sidebar-toggle" type="button" aria-label="Open navigation" aria-controls="book-sidebar" aria-expanded="false">☰</button>
    <a class="site-title" href="/start/" aria-label="Upgrade Society home">
      <span class="site-mark" aria-hidden="true">
        <img src="/images/upgrade-society-icon.png" alt="" width="36" height="36">
      </span>
      <span>Upgrade Society</span>
    </a>
    <nav class="top-nav" aria-label="Primary navigation">
      {{ range $navigation }}
        {{ if eq .type "dropdown" }}
          <details class="top-nav-group">
            <summary>{{ .label }}</summary>
            <div class="top-nav-dropdown">
              {{ range .links }}
                <a href="{{ .url }}"{{ if .new_tab }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .label }}</a>
              {{ end }}
            </div>
          </details>
        {{ else }}
          <a href="{{ .url }}"{{ if or (and (eq .active_when "start") (hasPrefix $.RelPermalink "/start/")) (and (eq .active_when "section") (eq $.Params.citizen_upgrade_section .section)) (and (eq .active_when "about") (eq $.RelPermalink "/about/")) }} aria-current="page"{{ end }}>{{ .label }}</a>
        {{ end }}
      {{ end }}
    </nav>
    <a class="header-search-link" href="#sidebar-search" aria-label="Search navigation">⌕</a>
  </div>
</header>
